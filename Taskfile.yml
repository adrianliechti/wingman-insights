version: "3"

dotenv: [".env"]

vars:
  REPOSITORY: ghcr.io/adrianliechti/wingman-insights

tasks:
  publish:
    desc: Build and push multi-arch Docker image
    deps: [pricing-update]
    cmds:
      - docker buildx build . --push --platform linux/amd64,linux/arm64 --tag {{.REPOSITORY}}

  build:
    desc: Build frontend then Go binary
    deps: [web-build]
    cmds:
      - go build -o insights .

  web-install:
    desc: Install frontend dependencies
    dir: web
    cmds:
      - npm install
    status:
      - test -d node_modules

  web-build:
    desc: Build React frontend with Vite
    deps: [web-install]
    dir: web
    cmds:
      - npm run build

  pricing-update:
    desc: Refresh the embedded models.dev pricing catalog
    cmds:
      - curl -fsSL -o internal/pricing/models.json https://models.dev/api.json

  dev:
    desc: Run Go backend (:4318) + Vite dev server (:5173); develop against :5173
    deps: [dev-backend, dev-web]

  dev-admin:
    desc: Same as dev, but the backend defaults you to the org-wide (admin) dashboard
    deps:
      - task: dev-backend
        vars: { DEV_ADMIN: "true" }
      - dev-web

  dev-backend:
    internal: true
    cmds:
      # Fail loudly on a port clash. Otherwise the backend exits while Vite
      # keeps serving :5173 and proxying /api to whatever owns the port, so the
      # SPA's /api/me fails and silently falls back to the personal-only view.
      - |
        PORT="${INSIGHTS_ADDR##*:}"; PORT="${PORT:-4318}"
        if command -v lsof >/dev/null 2>&1 && lsof -nP -iTCP:"$PORT" -sTCP:LISTEN >/dev/null 2>&1; then
          echo "dev-backend: port $PORT is already in use (common culprit: the wingman-lgtm OTLP container)." >&2
          echo "  Free it:  docker stop wingman-lgtm" >&2
          echo "  Or move:  INSIGHTS_ADDR=:4319 INSIGHTS_PROXY=http://localhost:4319 task dev-admin" >&2
          exit 1
        fi
      # go:embed web/dist must exist to compile; in dev the real UI is
      # served by Vite, which proxies /api and /v1 to this backend.
      - mkdir -p web/dist
      - test -f web/dist/index.html || printf '<!doctype html><p>dev stub — use the Vite dev server on :5173</p>' > web/dist/index.html
      # No oauth2-proxy in front of the dev server, so auth defaults off here;
      # an explicit INSIGHTS_AUTH_DISABLED (e.g. from .env) still wins.
      # INSIGHTS_DEV_ADMIN=true (via the dev-admin task) shows the org-wide dashboard.
      # Auto-load the demo directory (written by `task demo`) when present, so the
      # department/location views work locally without extra env; an explicit
      # INSIGHTS_DIRECTORY_FILE still wins, and production (no such file) is
      # unaffected.
      - |
        DIR="${INSIGHTS_DIRECTORY_FILE:-}"
        if [ -z "$DIR" ] && [ -f insights-directory.ndjson ]; then DIR="insights-directory.ndjson"; fi
        INSIGHTS_DIRECTORY_FILE="$DIR" \
        INSIGHTS_AUTH_DISABLED=${INSIGHTS_AUTH_DISABLED:-true} \
        INSIGHTS_DEV_ADMIN=${INSIGHTS_DEV_ADMIN:-{{.DEV_ADMIN | default "false"}}} \
        go run .

  dev-web:
    internal: true
    deps: [web-install]
    dir: web
    cmds:
      - npm run dev

  run:
    desc: Build and run the server
    deps: [build]
    cmds:
      - ./insights

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f insights insights.db insights.db.wal insights-directory.ndjson
      - rm -rf web/dist

  demo:
    desc: Generate 24h of demo data and send to the server
    cmds:
      # Also writes insights-directory.ndjson (synthetic departments/locations).
      # Start the server with INSIGHTS_DIRECTORY_FILE=insights-directory.ndjson
      # to light up the department/location views (e.g. "Risk by department").
      - go run ./cmd/demogen -duration={{.DURATION | default "168h"}} -interval={{.INTERVAL | default "5m"}} -directory={{.DIRECTORY | default "insights-directory.ndjson"}}
